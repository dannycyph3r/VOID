<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VOID · Flight</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
:root{--void:#0E0F10;--void-deep:#08090A;--void-raised:#18191B;--starlight:#E8E4D8;--starlight-dim:#B9B5AA;--telemetry:#8A8880;--flare:#82E6D0;--alarm:#D9604C;--hair:rgba(232,228,216,.10);--hair-strong:rgba(232,228,216,.24);--display:'Barlow Condensed','Arial Narrow',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
body{margin:0;background:#0E0F10}
a{color:#E8E4D8;text-decoration:none}a:hover{color:#FFFFFF}
a:focus-visible,button:focus-visible{outline:2px solid #82E6D0;outline-offset:3px}
.v-fx{position:absolute;inset:0;pointer-events:none;z-index:40;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.12) 3px)}
.v-vig{position:absolute;inset:0;pointer-events:none;z-index:39;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 62%,rgba(0,0,0,.45) 100%)}
.v-primary:hover{background:#A6EEDD !important}
.v-ghost:hover{background:rgba(232,228,216,.05)}
.v-key:hover{border-color:rgba(232,228,216,.5) !important}
.v-key:active,.v-primary:active{transform:translateY(1px)}
.v-glow{text-shadow:0 0 10px rgba(130,230,208,.35)}
@keyframes v-flow{to{stroke-dashoffset:-56}}
@keyframes v-pulse{0%{opacity:.6;transform:scale(.7)}100%{opacity:0;transform:scale(1.7)}}
@keyframes v-flick{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes v-sig{0%{opacity:0;transform:translateX(3px)}20%{opacity:.7}30%{opacity:.2;transform:translateX(-1px)}50%{opacity:1;transform:none}100%{opacity:1}}
.v-flow{animation:v-flow 2.4s linear infinite}
.v-pulse{transform-box:fill-box;transform-origin:center;animation:v-pulse 2.4s cubic-bezier(.2,.7,.2,1) infinite}
.v-flick{animation:v-flick .12s steps(2) infinite}
.v-sig{animation:v-sig .4s steps(6) both}
.v-still .v-flow,.v-still .v-pulse,.v-still .v-flick,.v-still .v-sig{animation:none !important}
@media (prefers-reduced-motion: reduce){.v-flow,.v-pulse,.v-flick,.v-sig{animation:none !important}}
</style>
</helmet>
<div class="{{rootClass}}" style="min-height: 100vh; box-sizing: border-box; background: #0E0F10; color: #E8E4D8; font-family: var(--mono); display: flex; flex-direction: column; padding: 0 clamp(12px, 2vw, 28px) clamp(12px, 2vw, 20px); position: relative; overflow: hidden">
  <div class="v-vig"></div>
  <div class="v-fx"></div>

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px">
    <button class="v-key" type="button" onClick="{{pause}}" aria-label="Pause" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid var(--hair-strong); color: #E8E4D8; cursor: pointer">
      <svg width="12" height="12" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><rect x="2" y="1" width="3" height="12"></rect><rect x="9" y="1" width="3" height="12"></rect></svg>
    </button>
    <div style="display: flex; align-items: baseline; gap: 14px">
      <span style="font-size: 12px; letter-spacing: 0.16em; color: var(--telemetry)">STAGE 02</span>
      <span style="font-family: var(--display); font-weight: 600; font-size: 28px; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1">Slingshot</span>
    </div>
    <button class="v-key" type="button" onClick="{{restart}}" aria-label="Restart" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid var(--hair-strong); color: #E8E4D8; cursor: pointer">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M2.5 7a4.5 4.5 0 1 0 1.4-3.3M2.5 1.5v3h3"></path></svg>
    </button>
  </header>

  <div style="flex: 1 1 auto; display: flex; flex-wrap: wrap; gap: 14px; position: relative; min-height: 0">

    <section data-engine-canvas="playfield" aria-label="Playfield" style="flex: 999 1 640px; min-width: 0; min-height: 520px; position: relative; background: #08090A; border: 1px solid var(--hair-strong); overflow: hidden">
      <svg viewBox="0 0 1150 720" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Stage 02: probe on pad, planet, moon, gate, singularity, beacon" style="position: absolute; inset: 0; width: 100%; height: 100%">
        <path d="{{gridPath}}" stroke="rgba(232,228,216,.04)" stroke-width="1"></path>
        <path d="{{rulerPath}}" stroke="rgba(232,228,216,.28)" stroke-width="1"></path>

        <circle cx="430" cy="410" r="224" fill="none" stroke="rgba(138,136,128,.26)" stroke-width="1" stroke-dasharray="1 6"></circle>
        <circle cx="430" cy="410" r="172" fill="none" stroke="rgba(138,136,128,.36)" stroke-width="1" stroke-dasharray="1 5"></circle>
        <circle cx="430" cy="410" r="128" fill="none" stroke="rgba(138,136,128,.48)" stroke-width="1" stroke-dasharray="1 4"></circle>
        <circle cx="430" cy="410" r="92" fill="none" stroke="rgba(138,136,128,.62)" stroke-width="1" stroke-dasharray="1 3"></circle>
        <circle cx="430" cy="410" r="62" fill="#E8E4D8"></circle>
        <circle cx="452" cy="398" r="58" fill="#08090A" opacity="0.88"></circle>
        <circle cx="430" cy="410" r="62" fill="none" stroke="#E8E4D8" stroke-width="1"></circle>

        <circle cx="800" cy="250" r="64" fill="none" stroke="rgba(138,136,128,.36)" stroke-width="1" stroke-dasharray="1 5"></circle>
        <circle cx="800" cy="250" r="40" fill="none" stroke="rgba(138,136,128,.52)" stroke-width="1" stroke-dasharray="1 3"></circle>
        <circle cx="800" cy="250" r="18" fill="#18191B" stroke="#E8E4D8" stroke-width="1"></circle>
        <ellipse cx="800" cy="250" rx="30" ry="8" fill="none" stroke="#E8E4D8" stroke-width="1" transform="rotate(-18 800 250)"></ellipse>

        <path d="M604 158 L676 94" stroke="#E8E4D8" stroke-width="1" stroke-dasharray="3 4"></path>
        <path d="M598 151 L610 165 M670 87 L682 101" stroke="#E8E4D8" stroke-width="2.5"></path>
        <text x="540" y="92" fill="#B9B5AA" font-family="IBM Plex Mono, monospace" font-size="13" letter-spacing="1.6">GATE</text>
        <rect x="540" y="100" width="56" height="3" fill="rgba(232,228,216,.16)"></rect>
        <rect x="540" y="100" width="34" height="3" fill="#E8E4D8"></rect>

        <circle cx="900" cy="560" r="78" fill="none" stroke="#D9604C" stroke-width="1" stroke-dasharray="2 6" opacity="0.55"></circle>
        <path d="{{hazardTeeth}}" stroke="#D9604C" stroke-width="1.4"></path>
        <circle cx="900" cy="560" r="28" fill="none" stroke="rgba(232,228,216,.4)" stroke-width="1"></circle>
        <circle cx="900" cy="560" r="20" fill="#000000" stroke="#E8E4D8" stroke-width="1"></circle>
        <text x="848" y="668" fill="#D9604C" font-family="IBM Plex Mono, monospace" font-size="13" letter-spacing="1.6">SINGULARITY</text>

        <circle class="v-pulse" cx="1040" cy="150" r="26" fill="none" stroke="#82E6D0" stroke-width="1"></circle>
        <circle cx="1040" cy="150" r="18" fill="none" stroke="#82E6D0" stroke-width="1" opacity="0.65"></circle>
        <circle cx="1040" cy="150" r="6" fill="#82E6D0"></circle>
        <path d="M1010 150 H1028 M1052 150 H1070 M1040 120 V138 M1040 162 V180" stroke="#82E6D0" stroke-width="1"></path>

        <path d="M90 626 H130 M90 626 V612 M130 626 V612" stroke="#E8E4D8" stroke-width="1"></path>

        <sc-if value="{{isAim}}" hint-placeholder-val="{{ true }}">
          <path class="v-flow" d="M110 610 C 250 570, 330 530, 420 500 C 520 466, 548 384, 560 300" fill="none" stroke="#82E6D0" stroke-width="1.5" stroke-dasharray="6 8"></path>
          <path d="M560 300 C 572 220, 600 160, 640 126" fill="none" stroke="#82E6D0" stroke-width="1.5" stroke-dasharray="2 10" opacity="0.4"></path>
          <path d="{{aimLine}}" stroke="#E8E4D8" stroke-width="1.2" fill="none"></path>
          <path d="{{aimArc}}" stroke="rgba(232,228,216,.4)" stroke-width="1" fill="none"></path>
          <text x="{{aimLabelX}}" y="{{aimLabelY}}" fill="#E8E4D8" font-family="IBM Plex Mono, monospace" font-size="13" letter-spacing="1.2">{{angleText}} · {{powerText}}</text>
          <rect x="104" y="604" width="12" height="12" fill="#E8E4D8" transform="rotate(45 110 610)"></rect>
        </sc-if>

        <sc-if value="{{isFlight}}" hint-placeholder-val="{{ false }}">
          <path d="M110 610 C 250 570, 330 530, 420 500 C 520 466, 548 384, 560 300" fill="none" stroke="#82E6D0" stroke-width="1.8"></path>
          <path class="v-flow" d="M560 300 C 572 220, 600 160, 640 126 C 740 50, 940 110, 1040 150" fill="none" stroke="#82E6D0" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.75"></path>
          <sc-if value="{{fireUp}}" hint-placeholder-val="{{ false }}"><path class="v-flick" d="M560 316 V346 M553 314 L546 336 M567 314 L574 336" stroke="#E8E4D8" stroke-width="1.4"></path></sc-if>
          <sc-if value="{{fireDown}}" hint-placeholder-val="{{ false }}"><path class="v-flick" d="M560 284 V254 M553 286 L546 264 M567 286 L574 264" stroke="#E8E4D8" stroke-width="1.4"></path></sc-if>
          <sc-if value="{{fireLeft}}" hint-placeholder-val="{{ false }}"><path class="v-flick" d="M576 300 H606 M578 293 L600 286 M578 307 L600 314" stroke="#E8E4D8" stroke-width="1.4"></path></sc-if>
          <sc-if value="{{fireRight}}" hint-placeholder-val="{{ false }}"><path class="v-flick" d="M544 300 H514 M542 293 L520 286 M542 307 L520 314" stroke="#E8E4D8" stroke-width="1.4"></path></sc-if>
          <rect x="554" y="294" width="12" height="12" fill="#E8E4D8" transform="rotate(45 560 300)"></rect>
          <circle cx="560" cy="300" r="16" fill="none" stroke="#82E6D0" stroke-width="1" opacity="0.55"></circle>
        </sc-if>
      </svg>
    </section>

    <aside aria-label="Telemetry" style="flex: 1 1 232px; max-width: 280px; min-width: 216px; display: flex; flex-direction: column; border: 1px solid var(--hair); background: #0E0F10">
      <div style="padding: 16px 18px; border-bottom: 1px solid var(--hair); display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; letter-spacing: 0.16em; color: var(--telemetry)">TIME</span>
        <span class="v-glow" style="font-size: 38px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; color: #82E6D0">{{timeText}}</span>
      </div>
      <div style="padding: 16px 18px; border-bottom: 1px solid var(--hair); display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <span style="font-size: 12px; letter-spacing: 0.16em; color: {{fuelLabelColor}}">{{fuelLabel}}</span>
          <span style="font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; color: {{fuelColor}}">{{fuelText}}</span>
        </div>
        <div role="meter" aria-label="Fuel remaining" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{fuelNow}}" style="display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 2px">
          <sc-for list="{{fuelSegs}}" as="s" hint-placeholder-count="20"><span style="height: 12px; background: {{s.fill}}"></span></sc-for>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--telemetry); font-variant-numeric: tabular-nums"><span>SPENT</span><span style="color: #B9B5AA">{{spentText}}</span></div>
      </div>
      <ol aria-label="Objective" style="list-style: none; margin: 0; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; letter-spacing: 0.1em">
        <li style="display: flex; gap: 10px; align-items: center"><span aria-hidden="true" style="width: 10px; height: 10px; border: 1px solid #E8E4D8; box-sizing: border-box"></span>GATE</li>
        <li style="display: flex; gap: 10px; align-items: center"><span aria-hidden="true" style="width: 10px; height: 10px; border: 1px solid #82E6D0; border-radius: 50%; box-sizing: border-box"></span>BEACON</li>
      </ol>
    </aside>

    <sc-if value="{{paused}}" hint-placeholder-val="{{ false }}">
      <div role="dialog" aria-modal="true" aria-label="Paused" style="position: absolute; inset: 0; z-index: 20; background: rgba(8,9,10,.86); display: flex; align-items: center; justify-content: center; padding: 16px">
        <div class="v-sig" style="width: 100%; max-width: 440px; background: #0E0F10; border: 1px solid var(--hair-strong); display: flex; flex-direction: column">
          <div style="padding: 20px 22px; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--hair)">
            <h2 style="margin: 0; font-family: var(--display); font-weight: 600; font-size: 40px; letter-spacing: 0.1em; text-transform: uppercase; line-height: 1">Paused</h2>
            <span style="font-size: 13px; color: var(--telemetry); font-variant-numeric: tabular-nums">{{timeText}}</span>
          </div>
          <div style="padding: 18px 22px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--hair)">
            <button class="v-primary" type="button" onClick="{{resume}}" style="height: 52px; background: #82E6D0; color: #0E0F10; border: 0; font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: 0.18em; cursor: pointer">RESUME</button>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
              <button class="v-ghost" type="button" onClick="{{restart}}" style="height: 48px; background: transparent; color: #E8E4D8; border: 1px solid var(--hair-strong); font-family: var(--mono); font-size: 12px; letter-spacing: 0.16em; cursor: pointer">RESTART</button>
              <a class="v-ghost" href="Missions.dc.html" style="height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--hair-strong); font-size: 12px; letter-spacing: 0.16em">STAGES</a>
            </div>
          </div>
          <div style="padding: 4px 22px; display: flex; flex-direction: column">
            <div style="display: flex; justify-content: space-between; align-items: center; min-height: 52px">
              <span style="font-size: 14px">Sound</span>
              <button type="button" onClick="{{toggleSound}}" aria-pressed="{{soundOn}}" style="min-width: 72px; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: transparent; border: 1px solid var(--hair-strong); color: {{soundFg}}; font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; cursor: pointer"><span style="width: 8px; height: 8px; border: 1px solid currentColor; background: {{soundDot}}"></span>{{soundLabel}}</button>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; border-top: 1px solid var(--hair)">
              <span style="font-size: 14px">Reduced motion</span>
              <button type="button" onClick="{{toggleMotion}}" aria-pressed="{{reduced}}" style="min-width: 72px; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: transparent; border: 1px solid var(--hair-strong); color: {{motionFg}}; font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; cursor: pointer"><span style="width: 8px; height: 8px; border: 1px solid currentColor; background: {{motionDot}}"></span>{{motionLabel}}</button>
            </div>
            <a href="HowTo.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--hair); font-size: 14px">How to Play<span style="color: var(--telemetry)">→</span></a>
          </div>
        </div>
      </div>
    </sc-if>
  </div>

  <footer style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; padding-top: 14px; position: relative; z-index: 1">
    <div role="status" aria-label="Flight phase" style="display: flex; border: 1px solid var(--hair)">
      <span style="padding: 12px 14px; font-size: 12px; letter-spacing: 0.16em; background: {{aimTabBg}}; color: {{aimTabFg}}">AIM</span>
      <span style="padding: 12px 14px; font-size: 12px; letter-spacing: 0.16em; background: {{flightTabBg}}; color: {{flightTabFg}}">FLIGHT</span>
    </div>

    <sc-if value="{{isAim}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
        <div style="display: flex; align-items: center; border: 1px solid var(--hair)">
          <button class="v-key" type="button" aria-label="Decrease angle" onClick="{{angleDown}}" style="width: 44px; height: 48px; background: transparent; border: 0; color: #E8E4D8; font-family: var(--mono); font-size: 16px; cursor: pointer">←</button>
          <span style="min-width: 70px; text-align: center; font-size: 14px; font-variant-numeric: tabular-nums">{{angleText}}</span>
          <button class="v-key" type="button" aria-label="Increase angle" onClick="{{angleUp}}" style="width: 44px; height: 48px; background: transparent; border: 0; color: #E8E4D8; font-family: var(--mono); font-size: 16px; cursor: pointer">→</button>
        </div>
        <div style="display: flex; align-items: center; border: 1px solid var(--hair)">
          <button class="v-key" type="button" aria-label="Decrease power" onClick="{{powerDown}}" style="width: 44px; height: 48px; background: transparent; border: 0; color: #E8E4D8; font-family: var(--mono); font-size: 16px; cursor: pointer">↓</button>
          <span style="min-width: 60px; text-align: center; font-size: 14px; font-variant-numeric: tabular-nums">{{powerText}}</span>
          <button class="v-key" type="button" aria-label="Increase power" onClick="{{powerUp}}" style="width: 44px; height: 48px; background: transparent; border: 0; color: #E8E4D8; font-family: var(--mono); font-size: 16px; cursor: pointer">↑</button>
        </div>
        <button class="v-primary" type="button" onClick="{{launch}}" style="height: 50px; padding: 0 22px; display: flex; align-items: center; gap: 12px; background: #82E6D0; color: #0E0F10; border: 0; font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: 0.18em; cursor: pointer">LAUNCH<span style="font-weight: 500; font-size: 12px; border: 1px solid rgba(14,15,16,.45); padding: 1px 6px; letter-spacing: 0.04em">Space</span></button>
      </div>
    </sc-if>

    <sc-if value="{{isFlight}}" hint-placeholder-val="{{ false }}">
      <div role="group" aria-label="Thrusters" style="display: grid; grid-template-columns: repeat(4, 48px); gap: 6px">
        <button class="v-key" type="button" aria-label="Thrust left" onClick="{{thrustLeft}}" style="height: 48px; background: {{keyLeftBg}}; color: {{keyLeftFg}}; border: 1px solid var(--hair-strong); font-family: var(--mono); font-size: 16px; cursor: pointer">←</button>
        <button class="v-key" type="button" aria-label="Thrust up" onClick="{{thrustUp}}" style="height: 48px; background: {{keyUpBg}}; color: {{keyUpFg}}; border: 1px solid var(--hair-strong); font-family: var(--mono); font-size: 16px; cursor: pointer">↑</button>
        <button class="v-key" type="button" aria-label="Thrust down" onClick="{{thrustDown}}" style="height: 48px; background: {{keyDownBg}}; color: {{keyDownFg}}; border: 1px solid var(--hair-strong); font-family: var(--mono); font-size: 16px; cursor: pointer">↓</button>
        <button class="v-key" type="button" aria-label="Thrust right" onClick="{{thrustRight}}" style="height: 48px; background: {{keyRightBg}}; color: {{keyRightFg}}; border: 1px solid var(--hair-strong); font-family: var(--mono); font-size: 16px; cursor: pointer">→</button>
      </div>
    </sc-if>

    <div style="display: flex; align-items: center; gap: 2px; border: 1px dashed rgba(138,136,128,.6); padding: 3px 3px 3px 10px">
      <span style="font-size: 12px; letter-spacing: 0.12em; color: var(--telemetry); padding-right: 4px">PROTO</span>
      <a class="v-ghost" href="Result.dc.html" style="min-height: 38px; display: flex; align-items: center; padding: 0 10px; font-size: 12px; letter-spacing: 0.12em; color: #82E6D0">ARRIVE</a>
      <a class="v-ghost" href="ResultFail.dc.html" style="min-height: 38px; display: flex; align-items: center; padding: 0 10px; font-size: 12px; letter-spacing: 0.12em; color: #D9604C">LOSE</a>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startPhase":{"editor":"enum","options":["aim","flight"],"default":"aim","section":"Prototype"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    var flight = (props.startPhase ?? 'aim') === 'flight';
    this.state = { phase: flight ? 'flight' : 'aim', elapsed: flight ? 12.4 : 0, fuel: flight ? 92.8 : 100, firing: null, paused: false, sound: true, reduced: false, angle: 16, power: 64 };
  }
  componentDidMount() {
    this._t = setInterval(() => {
      if (this.state.phase === 'flight' && !this.state.paused) this.setState({ elapsed: this.state.elapsed + 0.1 });
    }, 100);
  }
  componentWillUnmount() { clearInterval(this._t); clearTimeout(this._f); }
  burst(dir) {
    if (this.state.paused || this.state.fuel < 2.4) return;
    clearTimeout(this._f);
    this.setState({ fuel: Math.max(0, this.state.fuel - 2.4), firing: dir });
    this._f = setTimeout(() => this.setState({ firing: null }), 280);
  }
  renderVals() {
    var s = this.state, self = this;
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    var mins = Math.floor(s.elapsed / 60), secs = s.elapsed - mins * 60;
    var low = s.fuel < 20;

    var grid = '';
    for (var x = 50; x < 1150; x += 50) grid += 'M' + x + ' 0V720 ';
    for (var y = 50; y < 720; y += 50) grid += 'M0 ' + y + 'H1150 ';
    var ruler = '';
    for (var rx = 0; rx <= 1150; rx += 10) { var l = rx % 50 === 0 ? 10 : 4; ruler += 'M' + rx + ' 0V' + l + ' M' + rx + ' 720V' + (720 - l) + ' '; }
    for (var ry = 0; ry <= 720; ry += 10) { var k = ry % 50 === 0 ? 10 : 4; ruler += 'M0 ' + ry + 'H' + k + ' M1150 ' + ry + 'H' + (1150 - k) + ' '; }
    var teeth = '';
    for (var j = 0; j < 36; j++) {
      var b = (j * 10) * Math.PI / 180;
      teeth += 'M' + (900 + 44 * Math.cos(b)).toFixed(1) + ' ' + (560 + 44 * Math.sin(b)).toFixed(1) + 'L' + (900 + 56 * Math.cos(b)).toFixed(1) + ' ' + (560 + 56 * Math.sin(b)).toFixed(1) + ' ';
    }
    var a = s.angle * Math.PI / 180, len = 50 + s.power * 1.5;
    var ex = 110 + len * Math.cos(a), ey = 610 - len * Math.sin(a);
    var hx1 = ex - 10 * Math.cos(a - 0.4), hy1 = ey + 10 * Math.sin(a - 0.4);
    var hx2 = ex - 10 * Math.cos(a + 0.4), hy2 = ey + 10 * Math.sin(a + 0.4);
    var segs = [];
    for (var i = 0; i < 20; i++) segs.push({ fill: (i + 1) * 5 <= s.fuel + 0.01 ? (low ? '#D9604C' : '#E8E4D8') : 'rgba(232,228,216,.09)' });
    var key = function (d) { return s.firing === d; };
    var on = function (d) { return key(d) ? '#82E6D0' : 'transparent'; };
    var fg = function (d) { return key(d) ? '#0E0F10' : '#E8E4D8'; };
    var isAim = s.phase === 'aim';
    return {
      rootClass: s.reduced ? 'v-still' : 'v-live',
      gridPath: grid, rulerPath: ruler, hazardTeeth: teeth,
      isAim: isAim, isFlight: !isAim, paused: s.paused,
      aimLine: 'M110 610 L' + ex.toFixed(1) + ' ' + ey.toFixed(1) + ' M' + hx1.toFixed(1) + ' ' + hy1.toFixed(1) + ' L' + ex.toFixed(1) + ' ' + ey.toFixed(1) + ' L' + hx2.toFixed(1) + ' ' + hy2.toFixed(1),
      aimArc: 'M160 610 A50 50 0 0 0 ' + (110 + 50 * Math.cos(a)).toFixed(1) + ' ' + (610 - 50 * Math.sin(a)).toFixed(1),
      aimLabelX: (ex + 14).toFixed(0), aimLabelY: (ey - 8).toFixed(0),
      angleText: s.angle.toFixed(1) + '°', powerText: s.power + '%',
      timeText: pad(mins) + ':' + (secs < 10 ? '0' : '') + secs.toFixed(1),
      fuelText: s.fuel.toFixed(1), fuelNow: Math.round(s.fuel), fuelSegs: segs,
      fuelColor: low ? '#D9604C' : '#E8E4D8', fuelLabel: low ? 'FUEL LOW' : 'FUEL', fuelLabelColor: low ? '#D9604C' : '#8A8880',
      spentText: (100 - s.fuel).toFixed(1),
      fireUp: key('up'), fireDown: key('down'), fireLeft: key('left'), fireRight: key('right'),
      keyUpBg: on('up'), keyUpFg: fg('up'), keyDownBg: on('down'), keyDownFg: fg('down'),
      keyLeftBg: on('left'), keyLeftFg: fg('left'), keyRightBg: on('right'), keyRightFg: fg('right'),
      aimTabBg: isAim ? '#18191B' : 'transparent', aimTabFg: isAim ? '#82E6D0' : '#8A8880',
      flightTabBg: !isAim ? '#18191B' : 'transparent', flightTabFg: !isAim ? '#82E6D0' : '#8A8880',
      soundOn: s.sound, soundLabel: s.sound ? 'ON' : 'OFF', soundDot: s.sound ? '#82E6D0' : 'transparent', soundFg: s.sound ? '#82E6D0' : '#8A8880',
      reduced: s.reduced, motionLabel: s.reduced ? 'ON' : 'OFF', motionDot: s.reduced ? '#82E6D0' : 'transparent', motionFg: s.reduced ? '#82E6D0' : '#8A8880',
      launch: function () { self.setState({ phase: 'flight', elapsed: 0 }); },
      pause: function () { self.setState({ paused: true }); },
      resume: function () { self.setState({ paused: false }); },
      restart: function () { self.setState({ phase: 'aim', elapsed: 0, fuel: 100, firing: null, paused: false }); },
      toggleSound: function () { self.setState({ sound: !s.sound }); },
      toggleMotion: function () { self.setState({ reduced: !s.reduced }); },
      angleUp: function () { self.setState({ angle: Math.min(80, s.angle + 1) }); },
      angleDown: function () { self.setState({ angle: Math.max(0, s.angle - 1) }); },
      powerUp: function () { self.setState({ power: Math.min(100, s.power + 4) }); },
      powerDown: function () { self.setState({ power: Math.max(20, s.power - 4) }); },
      thrustUp: function () { self.burst('up'); }, thrustDown: function () { self.burst('down'); },
      thrustLeft: function () { self.burst('left'); }, thrustRight: function () { self.burst('right'); }
    };
  }
}
</script>
