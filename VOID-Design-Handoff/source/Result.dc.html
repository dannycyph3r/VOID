<style>
:root{--void:#0E0F10;--void-deep:#08090A;--starlight:#E8E4D8;--starlight-dim:#B9B5AA;--telemetry:#8A8880;--flare:#82E6D0;--alarm:#D9604C;--hair:rgba(232,228,216,.10);--hair-strong:rgba(232,228,216,.24);--display:'Barlow Condensed','Arial Narrow',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
body{margin:0;background:#0E0F10}
a{color:#E8E4D8;text-decoration:none}a:hover{color:#FFFFFF}
a:focus-visible,button:focus-visible{outline:2px solid #82E6D0;outline-offset:3px}
.v-fx{position:absolute;inset:0;pointer-events:none;z-index:40;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.18) 3px)}
.v-vig{position:absolute;inset:0;pointer-events:none;z-index:39;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 58%,rgba(0,0,0,.5) 100%)}
.v-primary:hover{background:#A6EEDD !important}
.v-ghost:hover{background:rgba(232,228,216,.05)}
.v-glow{text-shadow:0 0 22px rgba(130,230,208,.32)}
@keyframes v-sig{0%{opacity:0;transform:translateX(3px)}18%{opacity:.8}26%{opacity:.15;transform:translateX(-1px)}44%{opacity:1;transform:none}100%{opacity:1}}
@keyframes v-ring{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(3)}}
.v-sig{animation:v-sig .55s steps(7) .1s both}
.v-ring{transform-box:fill-box;transform-origin:center;animation:v-ring 1.4s cubic-bezier(.2,.7,.2,1) .4s 1 both}
@media (prefers-reduced-motion: reduce){.v-sig{animation:none !important}.v-ring{animation:none !important;opacity:0}}
</style>
