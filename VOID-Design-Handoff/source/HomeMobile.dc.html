<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VOID · Home, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
:root{--void:#0E0F10;--starlight:#E8E4D8;--telemetry:#8A8880;--flare:#82E6D0;--alarm:#D9604C;--hair:rgba(232,228,216,.10);--hair-strong:rgba(232,228,216,.24);--display:'Barlow Condensed','Arial Narrow',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
body{margin:0;background:#0E0F10}
a{color:#E8E4D8;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid #82E6D0;outline-offset:2px}
.v-fx{position:absolute;inset:0;pointer-events:none;z-index:40;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.18) 3px)}
.v-vig{position:absolute;inset:0;pointer-events:none;z-index:39;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
.v-glow{text-shadow:0 0 18px rgba(232,228,216,.18)}
@keyframes v-spin{to{transform:rotate(360deg)}}
@keyframes v-flow{to{stroke-dashoffset:-90}}
.v-spin{animation:v-spin 40s linear infinite}
.v-flow{animation:v-flow 3.2s linear infinite}
@media (prefers-reduced-motion: reduce){.v-spin,.v-flow{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F10; color: #E8E4D8; font-family: var(--mono); display: flex; flex-direction: column; padding: 8px 20px 24px; position: relative; overflow: hidden">
  <div class="v-vig"></div>
  <div class="v-fx"></div>

  <header style="display: flex; align-items: center; justify-content: space-between; height: 52px">
    <span style="font-size: 12px; letter-spacing: 0.12em; color: var(--telemetry); font-variant-numeric: tabular-nums">{{clock}} UTC</span>
    <button type="button" aria-label="Settings" aria-expanded="{{open}}" onClick="{{toggle}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid var(--hair-strong); color: #E8E4D8; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M2 5h8M14 5h2M2 13h2M8 13h8"></path><rect x="10" y="3" width="4" height="4"></rect><rect x="4" y="11" width="4" height="4"></rect></svg>
    </button>
  </header>

  <sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
    <div role="dialog" aria-label="Settings" style="position: absolute; left: 20px; right: 20px; top: 64px; z-index: 30; background: #0E0F10; border: 1px solid var(--hair-strong)">
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 56px; padding: 0 14px; border-bottom: 1px solid var(--hair)"><span style="font-size: 14px">Sound</span><span style="font-size: 12px; letter-spacing: 0.12em; color: #82E6D0">ON</span></div>
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 56px; padding: 0 14px"><span style="font-size: 14px">Reduced motion</span><span style="font-size: 12px; letter-spacing: 0.12em; color: var(--telemetry)">OFF</span></div>
    </div>
  </sc-if>

  <h1 class="v-glow" style="margin: 28px 0 0; font-family: var(--display); font-weight: 600; font-size: 150px; line-height: 0.8; letter-spacing: 0.06em; text-transform: uppercase; position: relative; z-index: 1">{{name}}</h1>
  <div aria-hidden="true" style="display: flex; gap: 8px; align-items: center; margin-top: 14px"><span style="height: 1px; flex: 1 1 auto; background: var(--hair-strong)"></span><span style="width: 24px; height: 1px; background: #82E6D0"></span></div>

  <div aria-hidden="true" style="position: relative; width: 260px; height: 260px; margin: 18px auto 0">
    <svg viewBox="0 0 260 260" style="position: absolute; inset: 0; width: 100%; height: 100%">
      <circle cx="130" cy="130" r="124" fill="none" stroke="rgba(232,228,216,.12)"></circle>
      <circle cx="130" cy="130" r="90" fill="none" stroke="rgba(232,228,216,.12)"></circle>
      <circle cx="130" cy="130" r="50" fill="none" stroke="rgba(138,136,128,.5)" stroke-dasharray="1 4"></circle>
      <circle cx="130" cy="130" r="22" fill="#E8E4D8"></circle>
      <circle cx="139" cy="126" r="20" fill="#0E0F10" opacity="0.9"></circle>
      <circle cx="130" cy="130" r="22" fill="none" stroke="#E8E4D8"></circle>
      <path class="v-flow" d="M14 236 C 60 200, 100 180, 118 162 C 140 140, 168 150, 172 124 C 176 98, 160 80, 180 60 C 196 44, 218 36, 236 32" fill="none" stroke="#82E6D0" stroke-width="1.4" stroke-dasharray="5 7"></path>
      <circle cx="236" cy="32" r="4" fill="#82E6D0"></circle>
      <circle cx="236" cy="32" r="11" fill="none" stroke="#82E6D0"></circle>
    </svg>
    <div class="v-spin" style="position: absolute; left: 40px; top: 40px; width: 180px; height: 180px">
      <div style="position: absolute; left: 50%; top: 0; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #E8E4D8"></div>
    </div>
  </div>

  <nav aria-label="Main" style="margin-top: auto; display: flex; flex-direction: column; border-top: 1px solid var(--hair); position: relative; z-index: 1">
    <a href="Missions.dc.html" style="min-height: 60px; display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 10px; border-bottom: 1px solid var(--hair)"><span style="font-size: 12px; color: #82E6D0">▸</span><span style="font-family: var(--display); font-weight: 500; font-size: 30px; letter-spacing: 0.06em; text-transform: uppercase; color: #82E6D0">Stages</span><span style="font-size: 12px; color: var(--telemetry)">6</span></a>
    <a href="PlayMobile.dc.html" style="min-height: 60px; display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 10px; border-bottom: 1px solid var(--hair)"><span></span><span style="font-family: var(--display); font-weight: 500; font-size: 30px; letter-spacing: 0.06em; text-transform: uppercase">Daily</span><span style="font-size: 12px; color: var(--telemetry); font-variant-numeric: tabular-nums">{{countdown}}</span></a>
    <a href="Leaderboard.dc.html" style="min-height: 60px; display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 10px; border-bottom: 1px solid var(--hair)"><span></span><span style="font-family: var(--display); font-weight: 500; font-size: 30px; letter-spacing: 0.06em; text-transform: uppercase">Stats</span><span></span></a>
    <a href="HowTo.dc.html" style="min-height: 60px; display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 10px; border-bottom: 1px solid var(--hair)"><span></span><span style="font-family: var(--display); font-weight: 500; font-size: 30px; letter-spacing: 0.06em; text-transform: uppercase">How to Play</span><span></span></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"productName":{"editor":"text","default":"VOID","section":"Brand"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: false }; }
  componentDidMount() { this._t = setInterval(() => this.forceUpdate(), 1000); }
  componentWillUnmount() { clearInterval(this._t); }
  renderVals() {
    var self = this;
    var now = new Date();
    var y = now.getUTCFullYear(), m = now.getUTCMonth(), d = now.getUTCDate();
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    var left = Math.max(0, Date.UTC(y, m, d + 1) - now.getTime());
    return {
      name: (this.props.productName ?? 'VOID').trim() || 'VOID',
      clock: pad(now.getUTCHours()) + ':' + pad(now.getUTCMinutes()) + ':' + pad(now.getUTCSeconds()),
      countdown: pad(Math.floor(left / 3600000)) + ':' + pad(Math.floor(left / 60000) % 60) + ':' + pad(Math.floor(left / 1000) % 60),
      open: this.state.open,
      toggle: function () { self.setState({ open: !self.state.open }); }
    };
  }
}
</script>
</body>
</html>
